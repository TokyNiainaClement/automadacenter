vich_uploader:
    db_driver: orm

    metadata:
       type: attribute

    mappings:
       car_images:
           uri_prefix: /images/car
           upload_destination: '%kernel.project_dir%/public/images/car'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
       verification_documents:
           uri_prefix: /documents/seller
           upload_destination: '%kernel.project_dir%/public/documents/seller'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
       logo_images:
           uri_prefix: /images/seller
           upload_destination: '%kernel.project_dir%/public/images/seller'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
